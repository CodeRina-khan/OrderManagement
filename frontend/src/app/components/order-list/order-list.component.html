<div class="order-list-container">
  <h2>Order List</h2>

  <div *ngIf="loading" class="loading-message">Loading orders...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <table *ngIf="!loading && !error && orders.length > 0" class="order-table">
    <thead>
      <tr>
        <th>Order Number</th>
        <th>Customer Name</th>
        <th>Order Date</th>
        <th>Total Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders" (click)="viewOrderDetails(order.id)" class="clickable-row">
        <td>{{ order.orderNumber }}</td>
        <td>{{ order.customerName }}</td>
        <td>{{ order.orderDate | date:'shortDate' }}</td>
        <td>{{ order.totalAmount | currency:'USD':'symbol':'1.2-2' }}</td>
        <td><span class="status-badge status-{{ order.status }}">{{ order.status | titlecase }}</span></td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !error && orders.length === 0" class="no-orders-message">
    No orders found.
  </div>
</div>
